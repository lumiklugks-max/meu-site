<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login / Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos de emergência caso o style.css falhe */
        body { background: #1a1a2e; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
        .auth-container { width: 100%; max-width: 400px; background: #16213e; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .tabs { display: flex; margin-bottom: 25px; border-bottom: 2px solid #0f3460; }
        .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; transition: 0.3s; color: #888; }
        .tab.active { color: #00d2ff; border-bottom: 3px solid #00d2ff; font-weight: bold; }
        
        /* O segredo para não aparecer tudo junto: */
        form { display: none; flex-direction: column; gap: 15px; }
        form.active { display: flex; }
        
        input { padding: 12px; border-radius: 5px; border: 1px solid #0f3460; background: #1a1a2e; color: white; outline: none; }
        button { padding: 15px; border-radius: 5px; border: none; background: #00d2ff; color: #1a1a2e; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0099cc; }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="tabs">
        <div class="tab active" id="tabLoginBtn">Entrar</div>
        <div class="tab" id="tabCadastroBtn">Cadastrar</div>
    </div>

    <form id="fLogin" class="active">
        <input type="email" id="lEmail" placeholder="E-mail" required>
        <input type="password" id="lSenha" placeholder="Senha" required>
        <button type="submit">Aceder à Conta</button>
    </form>

    <form id="fCadastro">
        <input type="text" id="cNome" placeholder="Nome Completo" required>
        <input type="email" id="cEmail" placeholder="Seu melhor e-mail" required>
        <input type="password" id="cSenha" placeholder="Crie uma senha" required>
        <input type="tel" id="cTel" placeholder="WhatsApp (Ex: 11999998888)" required>
        <button type="submit">Finalizar Cadastro</button>
    </form>
</div>

        btnL.classList.add('active'); btnC.classList.remove('active');

        formC.classList.add('active'); formL.classList.remove('active');
    });
