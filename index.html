<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login / Cadastro - Minha Loja</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container { max-width: 400px; margin: 50px auto; padding: 20px; background: #1a1a2e; border-radius: 15px; color: white; }
        .tabs { display: flex; margin-bottom: 20px; cursor: pointer; border-bottom: 2px solid #333; }
        .tab { flex: 1; text-align: center; padding: 10px; transition: 0.3s; }
        .tab.active { border-bottom: 3px solid #00d2ff; color: #00d2ff; font-weight: bold; }
        form { display: none; flex-direction: column; gap: 15px; }
        form.active { display: flex; }
        input { padding: 12px; border-radius: 5px; border: 1px solid #333; background: #16213e; color: white; }
        button { padding: 15px; border-radius: 5px; border: none; background: #00d2ff; color: #1a1a2e; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="tabs">
        <div class="tab active" id="btnTabLogin">Login</div>
        <div class="tab" id="btnTabCadastro">Cadastro</div>
    </div>

    <form id="formLogin" class="active">
        <input type="email" id="lEmail" placeholder="Seu E-mail" required>
        <input type="password" id="lSenha" placeholder="Sua Senha" required>
        <button type="submit">Entrar</button>
    </form>

    <form id="formCadastro">
        <input type="text" id="cNome" placeholder="Nome Completo" required>
        <input type="email" id="cEmail" placeholder="E-mail" required>
        <input type="password" id="cSenha" placeholder="Senha (min. 6 chars)" required>
        <input type="tel" id="cTel" placeholder="WhatsApp (DDD+Número)" required>
        <button type="submit">Criar Minha Conta</button>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCZq4K95loqNKYYuPFFrMS9QcUTCQ-FYRU",
        authDomain: "cadastroteste047.firebaseapp.com",
        databaseURL: "https://cadastroteste047-default-rtdb.firebaseio.com",
        projectId: "cadastroteste047",
        storageBucket: "cadastroteste047.firebasestorage.app",
        appId: "1:908890693829:web:2bd31d24474e27507310ac"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Lógica das abas (sem usar 'onclick' no HTML)
    const tLog = document.getElementById('btnTabLogin');
    const tCad = document.getElementById('btnTabCadastro');
    const fLog = document.getElementById('formLogin');
    const fCad = document.getElementById('formCadastro');

    tLog.addEventListener('click', () => {
        tLog.classList.add('active'); tCad.classList.remove('active');
        fLog.classList.add('active'); fCad.classList.remove('active');
    });

    tCad.addEventListener('click', () => {
        tCad.classList.add('active'); tLog.classList.remove('active');
        fCad.classList.add('active'); fLog.classList.remove('active');
    });

    // Cadastro
    fCad.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('cEmail').value;
        const senha = document.getElementById('cSenha').value;
        
        createUserWithEmailAndPassword(auth, email, senha)
            .then((res) => {
                const dados = {
                    nome: document.getElementById('cNome').value,
                    telefone: document.getElementById('cTel').value,
                    email: email
                };
                set(ref(db, 'usuarios/' + res.user.uid), dados).then(() => {
                    alert("Bem-vindo(a)!");
                    window.location.href = 'showcase.html';
                });
            })
            .catch(err => alert("Erro no cadastro: " + err.message));
    });

    // Login
    fLog.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('lEmail').value;
        const senha = document.getElementById('lSenha').value;
        
        signInWithEmailAndPassword(auth, email, senha)
            .then(() => window.location.href = 'showcase.html')
            .catch(() => alert("E-mail ou senha incorretos."));
    });
</script>
</body>
</html>
