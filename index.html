<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login / Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #1a1a2e; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
        .auth-container { width: 100%; max-width: 400px; background: #16213e; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .tabs { display: flex; margin-bottom: 25px; border-bottom: 2px solid #0f3460; }
        .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; transition: 0.3s; color: #888; }
        .tab.active { color: #00d2ff; border-bottom: 3px solid #00d2ff; font-weight: bold; }
        form { display: none; flex-direction: column; gap: 15px; }
        form.active { display: flex; }
        input { padding: 12px; border-radius: 5px; border: 1px solid #0f3460; background: #1a1a2e; color: white; outline: none; }
        button { padding: 15px; border-radius: 5px; border: none; background: #00d2ff; color: #1a1a2e; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="tabs">
        <div class="tab active" id="tLog">Entrar</div>
        <div class="tab" id="tCad">Cadastrar</div>
    </div>

    <form id="formL" class="active">
        <input type="email" id="emailL" placeholder="E-mail" required>
        <input type="password" id="senhaL" placeholder="Senha" required>
        <button type="submit">Aceder à Conta</button>
    </form>

    <form id="formC">
        <input type="text" id="nomeC" placeholder="Nome Completo" required>
        <input type="email" id="emailC" placeholder="E-mail" required>
        <input type="password" id="senhaC" placeholder="Senha" required>
        <input type="tel" id="telC" placeholder="WhatsApp" required>
        <button type="submit">Finalizar Cadastro</button>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCZq4K95loqNKYYuPFFrMS9QcUTCQ-FYRU",
        authDomain: "cadastroteste047.firebaseapp.com",
        databaseURL: "https://cadastroteste047-default-rtdb.firebaseio.com",
        projectId: "cadastroteste047",
        storageBucket: "cadastroteste047.firebasestorage.app",
        appId: "1:908890693829:web:2bd31d24474e27507310ac"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Seletores
    const tabL = document.getElementById('tLog');
    const tabC = document.getElementById('tCad');
    const fL = document.getElementById('formL');
    const fC = document.getElementById('formC');

    // Troca de Abas
    tabL.addEventListener('click', () => {
        tabL.classList.add('active'); tabC.classList.remove('active');
        fL.classList.add('active'); fC.classList.remove('active');
    });

    tabC.addEventListener('click', () => {
        tabC.classList.add('active'); tabL.classList.remove('active');
        fC.classList.add('active'); fL.classList.remove('active');
    });

    // LOGIN
    fL.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('emailL').value;
        const senha = document.getElementById('senhaL').value;

        signInWithEmailAndPassword(auth, email, senha)
            .then(() => { window.location.href = 'showcase.html'; })
            .catch((err) => { alert("Erro ao entrar: " + err.message); });
    });

    // CADASTRO
    fC.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('emailC').value;
        const senha = document.getElementById('emailC').value; // Pegando o valor correto
        const nome = document.getElementById('nomeC').value;
        const tel = document.getElementById('telC').value;

        createUserWithEmailAndPassword(auth, email, senha)
            .then((res) => {
                set(ref(db, 'usuarios/' + res.user.uid), {
                    nome: nome,
                    email: email,
                    telefone: tel
                }).then(() => {
                    alert("Cadastrado com sucesso!");
                    window.location.href = 'showcase.html';
                });
            })
            .catch((err) => { alert("Erro ao cadastrar: " + err.message); });
    });
</script>
</body>
</html>
