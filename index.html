<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login / Cadastro</title>
    <style>
        body { background: #1a1a2e; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
        .auth-container { width: 100%; max-width: 400px; background: #16213e; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .tabs { display: flex; margin-bottom: 25px; border-bottom: 2px solid #0f3460; }
        .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; color: #888; }
        .tab.active { color: #00d2ff; border-bottom: 3px solid #00d2ff; font-weight: bold; }
        form { display: none; flex-direction: column; gap: 15px; }
        form.active { display: flex; }
        input { padding: 12px; border-radius: 5px; border: 1px solid #0f3460; background: #1a1a2e; color: white; outline: none; }
        button { padding: 15px; border-radius: 5px; border: none; background: #00d2ff; color: #1a1a2e; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="tabs">
        <div class="tab active" id="tabL">Entrar</div>
        <div class="tab" id="tabC">Cadastrar</div>
    </div>

    <form id="fLogin" class="active">
        <input type="email" id="lEmail" placeholder="E-mail" required>
        <input type="password" id="lSenha" placeholder="Senha" required>
        <button type="submit">Entrar</button>
    </form>

    <form id="fCad">
        <input type="text" id="cNome" placeholder="Nome Completo" required>
        <input type="email" id="cEmail" placeholder="E-mail" required>
        <input type="password" id="cSenha" placeholder="Senha (mín. 6 caracteres)" required>
        <input type="tel" id="cTel" placeholder="WhatsApp" required>
        <button type="submit">Criar Conta</button>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCZq4K95loqNKYYuPFFrMS9QcUTCQ-FYRU",
        authDomain: "cadastroteste047.firebaseapp.com",
        databaseURL: "https://cadastroteste047-default-rtdb.firebaseio.com",
        projectId: "cadastroteste047",
        storageBucket: "cadastroteste047.firebasestorage.app",
        appId: "1:908890693829:web:2bd31d24474e27507310ac"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const tL = document.getElementById('tabL');
    const tC = document.getElementById('tabC');
    const formL = document.getElementById('fLogin');
    const formC = document.getElementById('fCad');

    // Troca de abas
    tL.onclick = () => {
        tL.classList.add('active'); tC.classList.remove('active');
        formL.classList.add('active'); formC.classList.remove('active');
    };
    tC.onclick = () => {
        tC.classList.add('active'); tL.classList.remove('active');
        formC.classList.add('active'); formL.classList.remove('active');
    };

    // LOGIN
    formL.onsubmit = (e) => {
        e.preventDefault();
        const email = document.getElementById('lEmail').value;
        const senha = document.getElementById('lSenha').value;

        signInWithEmailAndPassword(auth, email, senha)
            .then(() => { window.location.href = 'showcase.html'; })
            .catch(err => alert("Erro ao entrar: " + err.message));
    };

    // CADASTRO
    formC.onsubmit = (e) => {
        e.preventDefault();
        const email = document.getElementById('cEmail').value;
        const senha = document.getElementById('cSenha').value; // CORRIGIDO: Agora pega o ID cSenha
        const nome = document.getElementById('cNome').value;
        const tel = document.getElementById('cTel').value;

        createUserWithEmailAndPassword(auth, email, senha)
            .then((res) => {
                set(ref(db, 'usuarios/' + res.user.uid), {
                    nome: nome,
                    email: email,
                    telefone: tel
                }).then(() => {
                    alert("Conta criada com sucesso!");
                    window.location.href = 'showcase.html';
                });
            })
            .catch(err => alert("Erro no cadastro: " + err.message));
    };
</script>
</body>
</html>
