<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Pagamento - Finalizar</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #1a1a2e; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .payment-box { background: #16213e; padding: 30px; border-radius: 15px; width: 400px; text-align: center; border: 1px solid #00d2ff; }
        .btn-finalizar { width: 100%; padding: 15px; background: #25d366; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 1.1em; }
    </style>
</head>
<body>

<div class="payment-box">
    <h2>Finalizar Pedido</h2>
    <p>Clique abaixo para confirmar sua compra e enviar ao administrador.</p>
    <button class="btn-finalizar" id="btnConfirmar">Confirmar Pedido ✅</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCZq4K95loqNKYYuPFFrMS9QcUTCQ-FYRU",
        authDomain: "cadastroteste047.firebaseapp.com",
        databaseURL: "https://cadastroteste047-default-rtdb.firebaseio.com",
        projectId: "cadastroteste047",
        storageBucket: "cadastroteste047.firebasestorage.app",
        appId: "1:908890693829:web:2bd31d24474e27507310ac"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let usuarioLogado = null;

    onAuthStateChanged(auth, (user) => {
        if (user) {
            usuarioLogado = user;
        } else {
            alert("Sessão expirada. Faça login novamente.");
            window.location.href = 'index.html';
        }
    });

   document.getElementById('btnConfirmar').onclick = () => {
    const carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
    
    // Função para limpar o preço e transformar em número real
    const limparPreco = (preco) => {
        if (typeof preco === 'number') return preco;
        // Remove R$, espaços e troca vírgula por ponto para o JS entender
        let valorLimpo = preco.replace('R$', '').replace(/\s/g, '').replace(',', '.');
        return parseFloat(valorLimpo) || 0;
    };

    const total = carrinho.reduce((acc, item) => {
        const precoNum = limparPreco(item.preco);
        return acc + (precoNum * item.quantidade);
    }, 0);

    if (carrinho.length === 0) return alert("Carrinho vazio!");

    const pedido = {
        cliente: usuarioLogado ? usuarioLogado.email : "Cliente não identificado",
        itens: carrinho,
        total: total, // Salva como número puro (ex: 1200.50)
        data: new Date().toLocaleString('pt-BR'),
        status: "Pendente"
    };

    push(ref(db, 'pedidos'), pedido).then(() => {
        localStorage.removeItem('carrinho');
        window.location.href = 'payment-confirmation.html';
    }).catch(err => alert("Erro ao salvar: " + err.message));
};
</script>
</body>
</html>
