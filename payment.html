<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Finalizar Pedido</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #1a1a2e; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .payment-box { background: #16213e; padding: 40px; border-radius: 15px; width: 450px; text-align: center; border: 2px solid #00d2ff; box-shadow: 0 0 20px rgba(0, 210, 255, 0.3); }
        .btn-confirmar { width: 100%; padding: 18px; background: #25d366; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 25px; font-size: 1.2em; transition: 0.3s; }
        .btn-confirmar:hover { background: #1eb954; transform: scale(1.02); }
        p { color: #ccc; line-height: 1.6; }
    </style>
</head>
<body>

<div class="payment-box">
    <h2 style="color: #00d2ff;">Finalizar Pedido 📦</h2>
    <p>Clique no botão abaixo para confirmar sua compra. <br> O administrador receberá seu pedido instantaneamente.</p>
    <button class="btn-confirmar" id="btnConfirmar">Confirmar Pedido ✅</button>
    <div id="status-envio" style="margin-top: 15px; font-size: 0.9em;"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCZq4K95loqNKYYuPFFrMS9QcUTCQ-FYRU",
        authDomain: "cadastroteste047.firebaseapp.com",
        databaseURL: "https://cadastroteste047-default-rtdb.firebaseio.com",
        projectId: "cadastroteste047",
        storageBucket: "cadastroteste047.firebasestorage.app",
        appId: "1:908890693829:web:2bd31d24474e27507310ac"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let usuarioEmail = "Cliente não identificado";

    onAuthStateChanged(auth, (user) => {
        if (user) {
            usuarioEmail = user.email;
        }
    });

const formatarPrecoParaNumero = (preco) => {
    if (typeof preco === 'number') return preco;
    if (!preco) return 0;

    let p = String(preco).replace('R$', '').trim();
    
    // Se tiver ponto e vírgula (ex: 1.200,50), remove o ponto e troca a vírgula
    if (p.includes('.') && p.includes(',')) {
        p = p.replace(/\./g, '').replace(',', '.');
    } 
    // Se só tiver vírgula (ex: 1200,50), troca por ponto
    else if (p.includes(',')) {
        p = p.replace(',', '.');
    }

    return parseFloat(p) || 0;
};

    document.getElementById('btnConfirmar').onclick = async function() {
        const statusDiv = document.getElementById('status-envio');
        const carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];

        if (carrinho.length === 0) {
            alert("Seu carrinho está vazio!");
            window.location.href = 'showcase.html';
            return;
        }

        this.disabled = true;
        this.innerText = "Enviando...";

        // Cálculo com a limpeza nova
        const totalPedido = carrinho.reduce((acc, item) => {
            const v = formatarPrecoParaNumero(item.preco);
            const q = parseInt(item.quantidade) || 0;
            return acc + (v * q);
        }, 0);

        const novoPedido = {
            cliente: usuarioEmail,
            itens: carrinho,
            total: totalPedido, // Aqui vai o número limpo (ex: 1200.50)
            data: new Date().toLocaleString('pt-BR'),
            status: "Pendente"
        };

        try {
            await push(ref(db, 'pedidos'), novoPedido);
            localStorage.removeItem('carrinho');
            statusDiv.style.color = "#25d366";
            statusDiv.innerHTML = "Pedido enviado com sucesso!";
            
            setTimeout(() => {
                window.location.href = 'payment-confirmation.html';
            }, 1500);

        } catch (error) {
            alert("Erro ao enviar: " + error.message);
            this.disabled = false;
            this.innerText = "Confirmar Pedido ✅";
        }
    };
</script>
</body>
</html>
