<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Produto</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .produto-container { display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; max-width: 1000px; margin: auto; background: #1a1a2e; border-radius: 15px; margin-top: 50px; color: white; }
        .produto-imagem img { max-width: 400px; border-radius: 10px; }
        .produto-info { flex: 1; }
        .preco-original { text-decoration: line-through; color: #888; font-size: 1.2em; }
        .preco-destaque { font-size: 2.2em; color: #00d2ff; margin: 10px 0; }
        .desconto-tag { background: #ff4b2b; color: white; padding: 5px 10px; border-radius: 5px; font-weight: bold; margin-bottom: 15px; display: inline-block; }
        .descricao-texto { margin: 20px 0; line-height: 1.6; color: #ccc; }
        .btn-comprar { background: #00d2ff; color: #1a1a2e; padding: 15px 30px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 1.1em; width: 100%; }
    </style>
</head>
<body>

<nav style="padding: 20px; text-align: center;">
    <a href="showcase.html" style="color: #00d2ff;">← Voltar para a Vitrine</a>
</nav>

<div id="detalhe-produto">
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCZq4K95loqNKYYuPFFrMS9QcUTCQ-FYRU",
        authDomain: "cadastroteste047.firebaseapp.com",
        databaseURL: "https://cadastroteste047-default-rtdb.firebaseio.com",
        projectId: "cadastroteste047",
        storageBucket: "cadastroteste047.firebasestorage.app",
        appId: "1:908890693829:web:2bd31d24474e27507310ac"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const produtoId = urlParams.get('id');
    const container = document.getElementById('detalhe-produto');

    if (produtoId) {
        onValue(ref(db, `produtos/${produtoId}`), (snapshot) => {
            const p = snapshot.val();
            if (p) {
                container.innerHTML = `
                    <div class="produto-container">
                        <div class="produto-imagem">
                            <img src="${p.imagem}" alt="${p.nome}">
                        </div>
                        <div class="produto-info">
                            <h1>${p.nome}</h1>
                            <div class="descricao-texto">${p.descricao || "Sem descrição."}</div>
                            
                            <p class="preco-original">R$ ${p.preco.toFixed(2)}</p>
                            <div id="area-preco">
                                </div>

                            <p>Estoque: <strong>${p.estoque} unidades</strong></p>
                            
                            <label>Quantidade:</label>
                            <input type="number" id="quantidade" value="1" min="1" max="${p.estoque}" 
                                   oninput="atualizarCalculo(${p.preco}, ${p.descontoMax})"
                                   style="width: 70px; padding: 8px; margin: 15px 0; border-radius: 5px;">
                            
                            <button class="btn-comprar" onclick="adicionarAoCarrinho('${produtoId}', '${p.nome}', ${p.preco}, ${p.descontoMax})">
                                Adicionar ao Carrinho
                            </button>
                        </div>
                    </div>
                `;
                // Calcula o preço inicial (1 unidade)
                atualizarCalculo(p.preco, p.descontoMax);
            }
        });
    }

    // A LÓGICA DO DESCONTO PROGRESSIVO
    window.atualizarCalculo = (precoBase, maxDesc) => {
        const qtd = parseInt(document.getElementById('quantidade').value) || 1;
        
        // Regra: 3% inicial + 0.5% por cada item extra
        let porcDesconto = 3 + (qtd - 1) * 0.5;
        
        // Trava no Desconto Máximo que você cadastrou no products.html
        if (porcDesconto > maxDesc) porcDesconto = maxDesc;

        const valorComDesconto = precoBase * (1 - porcDesconto / 100);
        
        document.getElementById('area-preco').innerHTML = `
            <div class="desconto-tag">GANHE ${porcDesconto.toFixed(1)}% DE DESCONTO</div>
            <p class="preco-destaque">R$ ${valorComDesconto.toFixed(2)} <small style="font-size: 0.4em; color: white;">/unidade</small></p>
        `;
    };

    window.adicionarAoCarrinho = (id, nome, precoOriginal, maxDesc) => {
        const qtd = parseInt(document.getElementById('quantidade').value);
        let porcDesconto = 3 + (qtd - 1) * 0.5;
        if (porcDesconto > maxDesc) porcDesconto = maxDesc;
        
        const precoFinal = precoOriginal * (1 - porcDesconto / 100);

        const item = { 
            id, 
            nome, 
            precoUnitario: precoFinal, 
            quantidade: qtd, 
            descontoAplicado: porcDesconto 
        };
        
        let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
        carrinho.push(item);
        localStorage.setItem('carrinho', JSON.stringify(carrinho));
        
        window.location.href = 'cart.html';
    };
</script>
</body>
</html>
