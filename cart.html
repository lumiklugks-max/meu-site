<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCZq4K95loqNKYYuPFFrMS9QcUTCQ-FYRU",
        authDomain: "cadastroteste047.firebaseapp.com",
        databaseURL: "https://cadastroteste047-default-rtdb.firebaseio.com",
        projectId: "cadastroteste047",
        storageBucket: "cadastroteste047.firebasestorage.app",
        appId: "1:908890693829:web:2bd31d24474e27507310ac"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    window.carregarCarrinho = function() {
        const itensArea = document.getElementById('itens-carrinho');
        const totalArea = document.getElementById('valor-total');
        const carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
        
        itensArea.innerHTML = '';
        let somaTotal = 0;

        if (carrinho.length === 0) {
            itensArea.innerHTML = '<p>Seu carrinho está vazio.</p>';
        } else {
            carrinho.forEach((item) => {
                // USANDO OS NOVOS NOMES DE CAMPOS: precoUnitario e descontoAplicado
                const preco = item.precoUnitario || item.preco; // Garante compatibilidade
                const subtotal = preco * item.quantidade;
                somaTotal += subtotal;
                
                itensArea.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <strong>${item.nome}</strong> 
                            <span style="color: #25d366; font-size: 0.8em;">(-${item.descontoAplicado}% off)</span><br>
                            Qtd: ${item.quantidade} x R$ ${preco.toFixed(2)}
                        </div>
                        <div>
                            R$ ${subtotal.toFixed(2)}
                        </div>
                    </div>
                `;
            });
        }
        totalArea.innerText = `R$ ${somaTotal.toFixed(2)}`;
    }

    window.limparCarrinho = function() {
        localStorage.removeItem('carrinho');
        window.carregarCarrinho();
    }

    document.getElementById('btnFinalizar').addEventListener('click', () => {
        const carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
        if (carrinho.length === 0) return alert("Carrinho vazio!");

        const usuario = auth.currentUser;
        const emailCliente = usuario ? usuario.email : "Cliente não logado";
        
        let totalPedido = 0;
        let resumoTexto = "";

        carrinho.forEach(item => {
            const preco = item.precoUnitario || item.preco;
            resumoTexto += `• ${item.nome} (Qtd: ${item.quantidade}) - R$ ${(preco * item.quantidade).toFixed(2)}%0A`;
            totalPedido += preco * item.quantidade;
        });

        const novoPedido = {
            cliente: emailCliente,
            itens: carrinho,
            total: totalPedido,
            data: new Date().toLocaleString('pt-BR'),
            status: 'Pendente'
        };

        push(ref(db, 'pedidos'), novoPedido).then(() => {
            const foneTio = "55XXXXXXXXXXX"; // COLOQUE O NÚMERO AQUI
            const mensagem = `Olá! Novo pedido de ${emailCliente}:%0A%0A${resumoTexto}%0A*Total: R$ ${totalPedido.toFixed(2)}*`;
            
            window.open(`https://wa.me/${foneTio}?text=${mensagem}`, '_blank');
            localStorage.removeItem('carrinho');
            window.carregarCarrinho();
        });
    });

    window.carregarCarrinho();
</script>
