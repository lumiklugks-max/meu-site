<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Carrinho 🛒</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .cart-container { max-width: 800px; margin: 50px auto; padding: 20px; background: #1a1a2e; border-radius: 15px; color: white; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #333; }
        .total-container { text-align: right; padding: 20px; font-size: 1.5em; }
        .btn-finalizar { background: #25d366; color: white; padding: 15px 30px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.2em; margin-top: 10px;}
        .btn-limpar { background: #ff4b2b; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px;}
    </style>
</head>
<body>

<nav style="padding: 20px;">
    <a href="showcase.html" style="color: #00d2ff;">← Continuar Comprando</a>
</nav>

<div class="cart-container">
    <h1>Meu Carrinho</h1>
    <div id="itens-carrinho">Carregando...</div>
    
    <div class="total-container">
        Total: <span id="valor-total" style="color: #00d2ff;">R$ 0,00</span>
    </div>

    <button class="btn-finalizar" id="btnFinalizar">Finalizar Pedido via WhatsApp 📱</button>
    <button class="btn-limpar" id="btnLimpar">Esvaziar Carrinho</button>
</div>

<script type="module">
    // Função simples para carregar os dados
    function renderizarCarrinho() {
        const itensArea = document.getElementById('itens-carrinho');
        const totalArea = document.getElementById('valor-total');
        const carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
        
        itensArea.innerHTML = '';
        let somaTotal = 0;

        if (carrinho.length === 0) {
            itensArea.innerHTML = '<p>Seu carrinho está vazio.</p>';
            totalArea.innerText = 'R$ 0,00';
            return;
        }

        carrinho.forEach((item) => {
            const preco = item.precoUnitario || item.preco || 0;
            const qtd = item.quantidade || 1;
            const subtotal = preco * qtd;
            somaTotal += subtotal;
            
            itensArea.innerHTML += `
                <div class="cart-item">
                    <div>
                        <strong>${item.nome}</strong><br>
                        <small>Desc: ${item.descontoAplicado || 0}% | Qtd: ${qtd}</small>
                    </div>
                    <div>R$ ${subtotal.toFixed(2)}</div>
                </div>
            `;
        });
        
        totalArea.innerText = `R$ ${somaTotal.toFixed(2)}`;
    }

    // Botão Limpar
    document.getElementById('btnLimpar').addEventListener('click', () => {
        localStorage.removeItem('carrinho');
        renderizarCarrinho();
    });

    // Botão Finalizar (Simplificado para evitar erro de tela branca)
    document.getElementById('btnFinalizar').addEventListener('click', () => {
        const carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
        if (carrinho.length === 0) return alert("Carrinho vazio!");
        
        let msg = "Novo Pedido:%0A";
        let total = 0;
        carrinho.forEach(i => {
            const p = i.precoUnitario || i.preco;
            msg += `- ${i.nome} (x${i.quantidade}): R$ ${(p * i.quantidade).toFixed(2)}%0A`;
            total += (p * i.quantidade);
        });
        msg += `%0ATotal: R$ ${total.toFixed(2)}`;
        
        window.open(`https://wa.me/55XXXXXXXXXXX?text=${msg}`, '_blank');
    });

    // Executa ao abrir
    renderizarCarrinho();
</script>
</body>
</html>
