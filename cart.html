<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCZq4K95loqNKYYuPFFrMS9QcUTCQ-FYRU",
        authDomain: "cadastroteste047.firebaseapp.com",
        databaseURL: "https://cadastroteste047-default-rtdb.firebaseio.com",
        projectId: "cadastroteste047",
        storageBucket: "cadastroteste047.firebasestorage.app",
        appId: "1:908890693829:web:2bd31d24474e27507310ac"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let userLogado = null;
    onAuthStateChanged(auth, (user) => { userLogado = user; });

    window.carregarCarrinho = function() {
        const itensArea = document.getElementById('itens-carrinho');
        const totalArea = document.getElementById('valor-total');
        const carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
        
        itensArea.innerHTML = '';
        let somaTotal = 0;

        if (carrinho.length === 0) {
            itensArea.innerHTML = '<p style="text-align:center;">Seu carrinho está vazio.</p>';
        } else {
            carrinho.forEach((item) => {
                // LIMPEZA CRÍTICA: Força o preço a ser número, removendo R$ se existir
                let precoLimpo = String(item.preco).replace('R$', '').replace(/\s/g, '').replace(',', '.');
                let precoNum = parseFloat(precoLimpo) || 0;
                let qtdNum = parseInt(item.quantidade) || 1;

                const subtotal = precoNum * qtdNum;
                somaTotal += subtotal;

                itensArea.innerHTML += `
                    <div class="cart-item">
                        <div><strong>${item.nome}</strong><br>Qtd: ${qtdNum}</div>
                        <div>R$ ${subtotal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
                    </div>`;
            });
        }
        totalArea.innerText = `R$ ${somaTotal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
    }

    window.limparCarrinho = function() {
        localStorage.removeItem('carrinho');
        window.carregarCarrinho();
    }

    document.getElementById('btnIrPagamento').addEventListener('click', () => {
        const carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
        if (carrinho.length === 0) return alert("Adicione itens antes de finalizar!");

        if (!userLogado) {
            alert("Você precisa fazer login para finalizar o pedido.");
            window.location.href = 'index.html';
        } else {
            window.location.href = 'payment.html';
        }
    });

    window.carregarCarrinho();
</script>
