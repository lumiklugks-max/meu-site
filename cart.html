<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Carrinho 🛒</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .cart-container { max-width: 800px; margin: 50px auto; padding: 20px; background: #1a1a2e; border-radius: 15px; color: white; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #333; }
        .total-container { text-align: right; padding: 20px; font-size: 1.5em; }
        .btn-finalizar { background: #00d2ff; color: #1a1a2e; padding: 15px 30px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.2em; transition: 0.3s; }
        .btn-finalizar:hover { background: #25d366; color: white; }
        .btn-limpar { background: #ff4b2b; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<nav style="padding: 20px;">
    <a href="showcase.html" style="color: #00d2ff;">← Continuar Comprando</a>
</nav>

<div class="cart-container">
    <h1>Meu Carrinho</h1>
    <div id="itens-carrinho"></div>
    
    <div class="total-container">
        Total: <span id="valor-total" style="color: #00d2ff;">R$ 0,00</span>
    </div>

    <button class="btn-finalizar" id="btnIrPagamento">Ir para o Pagamento 💳</button>
    <button class="btn-limpar" onclick="limparCarrinho()" style="width: 100%;">Esvaziar Carrinho</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCZq4K95loqNKYYuPFFrMS9QcUTCQ-FYRU",
        authDomain: "cadastroteste047.firebaseapp.com",
        databaseURL: "https://cadastroteste047-default-rtdb.firebaseio.com",
        projectId: "cadastroteste047",
        storageBucket: "cadastroteste047.firebasestorage.app",
        appId: "1:908890693829:web:2bd31d24474e27507310ac"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let userLogado = null;
    onAuthStateChanged(auth, (user) => {
        userLogado = user;
    });

    window.carregarCarrinho = function() {
        const itensArea = document.getElementById('itens-carrinho');
        const totalArea = document.getElementById('valor-total');
        const carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
        
        itensArea.innerHTML = '';
        let somaTotal = 0;

        if (carrinho.length === 0) {
            itensArea.innerHTML = '<p style="text-align:center;">Seu carrinho está vazio.</p>';
        } else {
            carrinho.forEach((item) => {
                // LIMPEZA: Remove caracteres de texto e garante o formato decimal correto
                let precoLimpo = String(item.preco).replace('R$', '').replace(/\s/g, '').replace(/\./g, '').replace(',', '.');
                let precoNum = parseFloat(precoLimpo) || 0;
                let qtdNum = parseInt(item.quantidade) || 1;

                const subtotal = precoNum * qtdNum;
                somaTotal += subtotal;

                itensArea.innerHTML += `
                    <div class="cart-item">
                        <div><strong>${item.nome}</strong><br>Qtd: ${qtdNum}</div>
                        <div>R$ ${subtotal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
                    </div>`;
            });
        }
        totalArea.innerText = `R$ ${somaTotal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
    }

    window.limparCarrinho = function() {
        localStorage.removeItem('carrinho');
        window.carregarCarrinho();
    }

    document.getElementById('btnIrPagamento').addEventListener('click', () => {
        const carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
        if (carrinho.length === 0) return alert("Adicione itens antes de finalizar!");

        if (!userLogado) {
            alert("Você precisa fazer login para finalizar o pedido.");
            window.location.href = 'index.html';
        } else {
            window.location.href = 'payment.html';
        }
    });

    window.carregarCarrinho();
</script>
</body>
</html>
