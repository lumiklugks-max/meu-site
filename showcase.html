<script type="module">
    // ... (mantenha os imports e firebaseConfig)

    onValue(produtosRef, (snapshot) => {
        container.innerHTML = ""; 
        const dados = snapshot.val();

        if (dados) {
            Object.keys(dados).forEach((id) => {
                const produto = dados[id];
                
                // GARANTIA: Converte para número caso esteja como texto no banco
                const precoNumerico = parseFloat(produto.preco) || 0;
                
                const card = `
                    <div class="card-produto" onclick="verDetalhes('${id}')">
                        <img src="${produto.imagem}" alt="${produto.nome}">
                        <h3>${produto.nome}</h3>
                        <p>R$ ${precoNumerico.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                    </div>
                `;
                container.innerHTML += card;
            });
        } else {
            container.innerHTML = "<p style='color:white; text-align:center; grid-column: 1/-1;'>Nenhum produto cadastrado.</p>";
        }
    });

    window.verDetalhes = (id) => {
        window.location.href = `list.html?id=${id}`;
    };
</script>
